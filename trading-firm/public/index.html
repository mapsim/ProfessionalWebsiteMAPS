<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Firm · Simulação</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <h1>Trading Firm</h1>
        <span id="mode" class="badge">a ligar…</span>
        <span id="data-badge" class="badge warn" hidden>Preços sintéticos</span>
      </div>
      <div class="controls">
        <label>Par <select id="symbol"></select></label>
        <label>Velocidade
          <select id="speed">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </label>
        <button id="run" class="primary" disabled>Iniciar sessão</button>
      </div>
    </header>

    <p id="banner" class="banner" hidden></p>

    <main class="layout">
      <section class="office">
        <canvas id="office" width="960" height="560" aria-label="Escritório da trading firm com os agentes"></canvas>
        <p class="hint">Cada boneco é um agente. Os que pensam com LLM mostram “…” enquanto trabalham; as mensagens aparecem em balões e ficam registadas ao lado.</p>
      </section>

      <aside class="side">
        <section class="card">
          <h2>Mercado</h2>
          <div id="market" class="muted">Inicia uma sessão para carregar os dados.</div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>Carteira fictícia</h2>
            <button id="reset" class="link">Repor</button>
          </div>
          <div id="portfolio"></div>
        </section>

        <section class="card grow">
          <h2>Comunicações</h2>
          <ol id="feed" class="feed"></ol>
          <p id="feed-empty" class="muted">Ainda não há mensagens.</p>
        </section>
      </aside>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
